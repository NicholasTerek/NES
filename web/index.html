<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NES</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preload" href="./assets/nes_console_and_controller.glb" as="fetch" crossorigin />
  <link rel="preload" href="./assets/sony_pvm-14l2_crt_tv.glb" as="fetch" crossorigin />
  <link rel="preload" href="./assets/nes_cartridge__super_mario_bros.glb" as="fetch" crossorigin />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
    <div class="loading-spinner" aria-hidden="true"></div>
    <div class="loading-label">Loading emulator</div>
  </div>

  <div id="stage"></div>
  <div class="top-fade"></div>

  <header class="hud">
    <div class="hud-menu">
      <button id="info-toggle" class="info-toggle" type="button" aria-label="Open controls" aria-expanded="false">!</button>

      <div id="info-panel" class="info-panel hidden">
        <div class="controls">
          <button id="load-rom" type="button" disabled>Load ROM</button>
          <input id="rom" type="file" accept=".nes,application/octet-stream" hidden />
          <button id="reset" type="button" disabled>Reset</button>
        </div>
        <div id="status" class="status">Initializing…</div>
        <div class="help">Arrows · X = A · Z = B · Enter = Start · Right Shift = Select · drag to orbit</div>
      </div>
    </div>
  </header>

  <script type="module" src="./main.js"></script>
</body>
</html>
