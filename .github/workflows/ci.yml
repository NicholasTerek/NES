name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsdl2-dev ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNES_BUILD_TESTS=ON
          -DNES_BUILD_SDL=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
